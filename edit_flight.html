{% extends 'base.html' %}
{% block title %}Edit Aircraft — SkyLine Airways{% endblock %}

{% block content %}
<div class="fade-in-up" style="max-width:520px;margin:0 auto;">
  <h2 class="page-title"><i class="bi bi-pencil-square"></i> Edit Aircraft</h2>

  <div class="card-dark">
    <div class="card-header-dark">
      <h5><i class="bi bi-pencil"></i> Update Aircraft Details</h5>
    </div>
    <div class="card-body-dark">
      <form method="POST" action="{{ url_for('edit_aircraft', acid=aircraft.aircraft_id) }}" class="form-dark">
        <div class="mb-3">
          <label class="form-label">Model Name</label>
          <input type="text" name="model" class="form-control"
                 value="{{ aircraft.model }}" required />
        </div>
        <div class="mb-4">
          <label class="form-label">Seating Capacity</label>
          <input type="number" name="capacity" class="form-control"
                 value="{{ aircraft.capacity }}" min="1" required />
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-gold"><i class="bi bi-check-lg"></i> Update</button>
          <a href="{{ url_for('manage_aircraft') }}" class="btn btn-outline-gold">
            <i class="bi bi-arrow-left"></i> Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
